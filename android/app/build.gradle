plugins {
    id 'com.android.application'
}

android {
    namespace 'com.securify.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.securify.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir layout.buildDirectory.dir('generated/securifyWebAssets')
        }
    }
}

def webAppRoot = rootProject.projectDir.parentFile

def generatedWebAssets = layout.buildDirectory.dir('generated/securifyWebAssets')

tasks.register('prepareSecurifyWebAssets', Copy) {
    from(webAppRoot) {
        include 'index.html'
        include 'styles.css'
        include 'app.js'
        include 'manifest.webmanifest'
        include 'icons/**'
    }
    into(generatedWebAssets)
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareSecurifyWebAssets')
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}

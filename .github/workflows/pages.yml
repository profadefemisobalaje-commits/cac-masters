name: Publish Securify site and privacy policy

on:
  push:
    branches:
      - arena/01c4b409-cac-masters
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'styles.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: securify-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy privacy policy and PWA
    if: github.ref == 'refs/heads/arena/01c4b409-cac-masters'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the session branch
        uses: actions/checkout@v7

      - name: Check whether GitHub Pages is enabled
        id: pages-status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/pages-response.json" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [[ "$status" == '200' ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ "$status" == '404' ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=GitHub Pages is not enabled::Enable GitHub Pages with the GitHub Actions source under repository Settings > Pages, then rerun this workflow to publish the privacy policy.'
          else
            cat "$RUNNER_TEMP/pages-response.json"
            echo "::error::Could not check GitHub Pages configuration (HTTP $status)."
            exit 1
          fi

      - name: Configure GitHub Pages
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Assemble static site
        run: |
          mkdir -p site/icons
          cp index.html privacy.html styles.css app.js manifest.webmanifest sw.js site/
          cp icons/* site/icons/
          touch site/.nojekyll

      - name: Upload static site
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy static site
        if: steps.pages-status.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

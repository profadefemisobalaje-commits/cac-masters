name: Build Securify Android APK

on:
  push:
    branches:
      - arena/01c4b409-cac-masters
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build installable debug APK
    if: github.ref == 'refs/heads/arena/01c4b409-cac-masters'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug bundleRelease
        working-directory: android

      - name: Verify and name APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Securify-debug.apk
          sha256sum artifacts/Securify-debug.apk | tee artifacts/Securify-debug.apk.sha256

      - name: Publish the built APK to the session branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/Securify-debug.apk artifacts/Securify-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "The APK on this branch is already current."
          else
            git commit -m "Publish Securify debug APK"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Securify-debug-apk
          path: |
            artifacts/Securify-debug.apk
            artifacts/Securify-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

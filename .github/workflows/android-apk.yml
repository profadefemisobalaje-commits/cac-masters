name: Build Securify Android APK

on:
  push:
    branches:
      - main
      - arena/01c4b409-cac-masters
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Verify and name APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Securify-debug.apk
          sha256sum artifacts/Securify-debug.apk | tee artifacts/Securify-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Securify-debug-apk
          path: |
            artifacts/Securify-debug.apk
            artifacts/Securify-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

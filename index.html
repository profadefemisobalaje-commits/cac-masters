<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f5">
  <meta name="description" content="Securify is a private, on-device file vault and Android security checklist.">
  <meta name="application-name" content="Securify">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Securify">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Securify — private by design</title>
  <link rel="icon" href="./icons/securify.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/securify-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <button class="brand" type="button" data-nav="overview" aria-label="Securify overview">
        <img class="brand-icon" src="./icons/securify.svg" alt="">
        <span class="brand-name">Securify</span>
        <span class="brand-edition">PERSONAL SECURITY</span>
      </button>

      <p class="nav-caption">WORKSPACE</p>
      <nav class="side-nav">
        <button class="nav-item is-active" type="button" data-nav="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="2"></rect></svg>
          <span>Overview</span>
        </button>
        <button class="nav-item" type="button" data-nav="vault">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><path d="M12 14v3"></path></svg>
          <span>Secure vault</span>
          <span class="nav-count" id="nav-vault-count" hidden>0</span>
        </button>
        <button class="nav-item" type="button" data-nav="checkup">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19 6v5.2c0 4.4-2.8 7.5-7 9.3-4.2-1.8-7-4.9-7-9.3V6l7-2.5Z"></path><path d="m9 12 2 2 4-4"></path></svg>
          <span>Device checkup</span>
        </button>
        <button class="nav-item" type="button" data-nav="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .8v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.8l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.8-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .8-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.8v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .8l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .8 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.8 3Z"></path></svg>
          <span>Settings &amp; help</span>
        </button>
      </nav>

      <div class="sidebar-spacer"></div>
      <div class="sidebar-assurance">
        <span class="assurance-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3.5 19 6v5.2c0 4.4-2.8 7.5-7 9.3-4.2-1.8-7-4.9-7-9.3V6l7-2.5Z"></path><path d="m9 12 2 2 4-4"></path></svg>
        </span>
        <p><strong>Private by design</strong><span>Your vault stays on this device.</span></p>
      </div>
      <div class="sidebar-foot"><span class="online-dot"></span> No account. No uploads.</div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="mobile-brand" aria-label="Securify">
          <img src="./icons/securify.svg" alt="" class="mobile-brand-icon">
          <span>Securify</span>
        </div>
        <div class="topbar-context">
          <span class="topbar-kicker">PERSONAL SECURITY</span>
          <span class="topbar-divider" aria-hidden="true">/</span>
          <span class="topbar-current" id="topbar-current">Overview</span>
        </div>
        <div class="topbar-actions">
          <span class="privacy-pill"><span class="online-dot"></span><span>On-device privacy</span></span>
          <button class="button button-small button-install" id="install-button" type="button" data-action="install" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11"></path><path d="m8 10 4 4 4-4"></path><path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"></path></svg>
            <span>Install</span>
          </button>
          <button class="icon-button" id="header-lock-button" type="button" data-action="lock" aria-label="Lock the vault" title="Lock vault" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          </button>
        </div>
      </header>

      <main class="page-content" id="main-content" tabindex="-1">
        <div class="loading-state" aria-label="Loading Securify">
          <img src="./icons/securify.svg" alt="">
          <span>Opening your private space…</span>
        </div>
      </main>

      <footer class="page-footer">
        <span>SECU RIFY <span class="footer-dot">·</span> BUILT FOR YOUR PRIVACY</span>
        <span>Developer: Securify</span>
      </footer>
    </div>

    <nav class="mobile-nav" aria-label="App navigation">
      <button class="mobile-nav-item is-active" type="button" data-nav="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="2"></rect></svg>
        <span>Home</span>
      </button>
      <button class="mobile-nav-item" type="button" data-nav="vault">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><path d="M12 14v3"></path></svg>
        <span>Vault</span>
      </button>
      <button class="mobile-nav-item" type="button" data-nav="checkup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19 6v5.2c0 4.4-2.8 7.5-7 9.3-4.2-1.8-7-4.9-7-9.3V6l7-2.5Z"></path><path d="m9 12 2 2 4-4"></path></svg>
        <span>Checkup</span>
      </button>
      <button class="mobile-nav-item" type="button" data-nav="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .8v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.8l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.8-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .8-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.8v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .8l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .8 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.8 3Z"></path></svg>
        <span>More</span>
      </button>
    </nav>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
